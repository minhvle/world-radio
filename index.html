<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Radio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#080b0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="World Radio">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span><span>World Radio</span></div>
      <span class="made-by">WORLD RADIO · PWA</span>
    </header>

    <section class="now-playing" aria-label="Now playing">
      <div class="station-art" id="player-art">36</div>
      <div class="player-main">
        <div class="player-title" id="player-title">Select a station</div>
        <div class="player-status" id="player-status">Ready</div>
      </div>
      <div class="player-meta" id="player-meta">—</div>
      <div class="levels" aria-hidden="true">
        <span class="level active"></span><span class="level"></span><span class="level"></span><span class="level"></span>
      </div>
    </section>

    <div class="equalizer" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <section class="controls" aria-label="Playback controls">
      <button type="button" class="icon-btn" id="prev" title="Previous">◀</button>
      <button type="button" class="play-btn" id="play" title="Play" aria-label="Play"><span class="play-icon" aria-hidden="true"></span></button>
      <button type="button" class="icon-btn" id="next" title="Next">▶</button>
      <button type="button" class="icon-btn" id="shuffle" title="Shuffle">⤨</button>
      <button type="button" class="icon-btn" id="sleep" title="Sleep timer">◔</button>
      <label class="volume-wrap" title="Volume">
        <span>🔊</span>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
      </label>
    </section>

    <div class="tag-row">
      <span class="eq-label">EQ</span>
      <button type="button" class="tag active" data-tag="pop">POP</button>
      <button type="button" class="tag" data-tag="news">NEWS</button>
      <button type="button" class="tag" data-tag="talk">TALK</button>
      <button type="button" class="tag" data-tag="jazz">JAZZ</button>
    </div>

    <section class="filters">
      <label class="select-wrap">
        <span class="sr-only">Country</span>
        <select id="country">
          <option value="">🌐 All countries</option>
          <option value="AU" selected>🇦🇺 Australia</option>
          <option value="US">🇺🇸 United States</option>
          <option value="GB">🇬🇧 United Kingdom</option>
          <option value="CA">🇨🇦 Canada</option>
          <option value="NZ">🇳🇿 New Zealand</option>
          <option value="JP">🇯🇵 Japan</option>
          <option value="VN">🇻🇳 Vietnam</option>
        </select>
      </label>
      <label class="select-wrap">
        <span class="sr-only">Language</span>
        <select id="language">
          <option value="">All languages</option>
          <option value="english" selected>English</option>
          <option value="vietnamese">Vietnamese</option>
          <option value="japanese">Japanese</option>
          <option value="french">French</option>
          <option value="german">German</option>
        </select>
      </label>
      <label class="search-wrap">
        <span>⌕</span>
        <input id="search" type="search" placeholder="Search all stations" autocomplete="off">
      </label>
    </section>

    <nav class="tabs" aria-label="Station categories">
      <button type="button" class="tab active" data-filter="all">All</button>
      <button type="button" class="tab" data-filter="saved">★ Favourites</button>
      <button type="button" class="tab" data-filter="recent">◷ Recent</button>
      <button type="button" class="tab" data-filter="music">Music</button>
      <button type="button" class="tab" data-filter="news">News</button>
      <button type="button" class="tab" data-filter="talk">Talk</button>
      <button type="button" class="tab" data-filter="sports">Sports</button>
      <button type="button" class="tab" data-filter="jazz">Jazz</button>
    </nav>

    <div class="list-header">
      <span id="result-count">Stations</span>
      <div class="list-actions">
        <button type="button" id="export-saved" class="list-action" title="Export saved stations">Export</button>
        <button type="button" id="import-saved" class="list-action" title="Import saved stations">Import</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
        <button type="button" id="refresh" class="refresh" title="Refresh stations" aria-label="Refresh stations">↻</button>
      </div>
    </div>

    <section id="station-list" class="station-list" aria-live="polite"></section>

    <div id="message" class="message" hidden></div>

    <audio id="audio" preload="none"></audio>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
